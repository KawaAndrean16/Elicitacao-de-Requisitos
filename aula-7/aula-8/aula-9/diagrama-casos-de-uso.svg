<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530">
  <rect width="820" height="530" fill="#ffffff" />
  
  <!-- Fronteira do Sistema -->
  <rect x="230" y="50" width="340" height="430" fill="#ffffff" stroke="#000000" stroke-width="2" />
  <text x="400" y="78" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000">Sistema de Empréstimo de Biblioteca</text>
  <line x1="230" y1="90" x2="570" y2="90" stroke="#000000" stroke-width="1" />

  <!-- Linhas de Associação -->
  <line x1="125" y1="165" x2="315" y2="155" stroke="#000000" stroke-width="1.5" />
  <line x1="125" y1="175" x2="315" y2="275" stroke="#000000" stroke-width="1.5" />
  
  <line x1="125" y1="335" x2="315" y2="165" stroke="#000000" stroke-width="1.5" />
  <line x1="125" y1="345" x2="315" y2="275" stroke="#000000" stroke-width="1.5" />
  <line x1="125" y1="355" x2="315" y2="395" stroke="#000000" stroke-width="1.5" />

  <line x1="485" y1="155" x2="640" y2="380" stroke="#000000" stroke-width="1.5" />
  <line x1="485" y1="395" x2="640" y2="395" stroke="#000000" stroke-width="1.5" />

  <!-- Casos de Uso -->
  <ellipse cx="400" cy="155" rx="85" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="400" y="160" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#000000">Solicitar Empréstimo</text>

  <ellipse cx="400" cy="275" rx="85" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="400" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#000000">Devolver Livro</text>

  <ellipse cx="400" cy="395" rx="85" ry="35" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="400" y="400" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#000000">Notificar Atraso</text>

  <!-- Ator 1: Aluno -->
  <circle cx="105" cy="140" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="152" x2="105" y2="185" stroke="#000000" stroke-width="1.5" />
  <line x1="88" y1="164" x2="122" y2="164" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="185" x2="90" y2="208" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="185" x2="120" y2="208" stroke="#000000" stroke-width="1.5" />
  <text x="105" y="225" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#000000">Aluno</text>

  <!-- Ator 2: Bibliotecário -->
  <circle cx="105" cy="315" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="327" x2="105" y2="360" stroke="#000000" stroke-width="1.5" />
  <line x1="88" y1="339" x2="122" y2="339" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="360" x2="90" y2="383" stroke="#000000" stroke-width="1.5" />
  <line x1="105" y1="360" x2="120" y2="383" stroke="#000000" stroke-width="1.5" />
  <text x="105" y="400" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#000000">Bibliotecário</text>

  <!-- Ator Secundário: Sistema de Pagamento -->
  <rect x="640" y="365" width="150" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="715" y="388" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#000000">&lt;&lt;system&gt;&gt;</text>
  <text x="715" y="408" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000">Sistema de Pagamento</text>
